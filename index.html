<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKAN NAME GENERATOR</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AKAN NAME GENERATOR</h1>
        <p>
            Enter your birth date and gender to discover your
            Akan name 😁😁😁😁
         </p>
         <form id="heritageFinder">
            <label>day</label>
            <input type="number" id="day" name="day" required>

            <label>month</label>
            <input type="number" id="month" name="month" required>

            <label>year</label>
            <input type="number" id="year" name="year" required>

            <label>gender</label>


        <div class="gender">

            <input 
                type="radio"
                name="gender"
                value="male"
            >
            male👨
            <input  
                type="radio"
                name="gender"
                value="female"
            >
            female👩
        </div>
        <button type="submit">
            Genarate Akan Name
        </button>
        <p id="result"></p>
    </form>
    
 </div>
 <script src="script.js"></script>

</body>
</html>
